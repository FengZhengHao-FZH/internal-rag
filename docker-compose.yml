services:
  mysql:
    image: mysql:8.0
    container_name: rag-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ragroot2026}
      MYSQL_DATABASE: internal_rag
      MYSQL_USER: rag
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ragpass2026}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-ragroot2026}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    container_name: rag-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+pymysql://rag:${MYSQL_PASSWORD:-ragpass2026}@mysql:3306/internal_rag?charset=utf8mb4
      API_HOST: 0.0.0.0
      API_PORT: "8000"
    volumes:
      - ./docs:/app/docs
      - ./faiss_index:/app/faiss_index
    expose:
      - "8000"
    # 首次启动先建表和初始化管理员/策略（幂等），再拉起服务
    command: >
      sh -c "python init_db.py && uvicorn api_server:app --host 0.0.0.0 --port 8000"

  nginx:
    image: nginx:alpine
    container_name: rag-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      TZ: Asia/Shanghai

volumes:
  mysql_data:
